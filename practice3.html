<html>
    
    <head>
        <h1>JavaScript Password Verification</h1>
        <script src="pract3.js" type="text/javascript" defer></script>
    </head>

    <body>

    <tlabel>Enter a password of at least 8 characters:</tlabel><br>
    <input type="text" id="firstpass" placeholder="Enter password">

    </body>
</html>
